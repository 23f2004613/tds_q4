name: Daily Update by 23f2004613@ds.study.iitm.ac.in

on:
  schedule:
    - cron: '0 22 * * *'  # Runs daily at 10 PM UTC (pick any specific hour/minute, not "*")
  workflow_dispatch:      # Lets you test manually right away

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp file by 23f2004613@ds.study.iitm.ac.in
        run: |
          echo "Last updated: $(date -u)" > last-update.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-update.txt
          git commit -m "Daily automated update - $(date -u)"
          git push
