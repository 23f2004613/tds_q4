name: "Daily Assignment Update"

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # ← ADD THIS

      - name: "Step with 23f2004613@ds.study.iitm.ac.in"
        run: |
          echo "# Daily update $(date -u '+%Y-%m-%d %H:%M:%S UTC') $(date +%s)" >> README.md
          git config user.name github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Daily commit $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main

